<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bildirim</title>
  </head>
  <body style="margin:0;padding:0;background:#f5f7fb;font-family:Arial,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table width="600" cellpadding="0" cellspacing="0" role="presentation" style="background:#ffffff;border-radius:12px;box-shadow:0 8px 24px rgba(15,23,42,0.08);overflow:hidden;">
            <tr>
              <td style="padding:32px;">
                <h2 style="margin:0 0 16px;font-size:22px;color:#0f172a;">{{title}}</h2>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#475569;">
                  {{body}}
                </p>
                {{actionButton}}
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px;background:#f8fafc;font-size:12px;color:#94a3b8;">
                Bu otomatik bir bildirimdir.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
